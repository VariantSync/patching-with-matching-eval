        message: "Throws more specific exceptions from TxManager#resume\n\nThere are two possible failures that can happen in #resume:\n (1) The current thread has already got another transaction associated with it\n (2) The transaction to be resumed is already associated with another thread\n\nThese two failures got their own exceptions: ThreadAssociatedWithOtherTransactionException and\nTransactionAlreadyActiveException so that callers can react appropriately\nto the two scenarios. Typically there's special handling of (2). Doing\nthis made UnableToResumeTransactionException redundant, and it was too\ngeneric to begin with as it represented both (1) and (2).\n\nThis commit also tidies up and corrects logging regarding old transactions\non the master which are to reaped, so less logging and more relevant\nlogging there.\n\n(cherry picked from commit 5581112812f76e96bf9f683d13f323e997c09b0e)\n\nConflicts:\n\tcommunity/kernel/src/main/java/org/neo4j/kernel/impl/transaction/TxManager.java\n\tenterprise/ha/src/main/java/org/neo4j/kernel/ha/MasterClient20.java\n\tenterprise/ha/src/main/java/org/neo4j/kernel/ha/cluster/DefaultMasterImplSPI.java\n\tenterprise/ha/src/main/java/org/neo4j/kernel/ha/com/master/MasterImpl.java\n\tenterprise/ha/src/main/java/org/neo4j/kernel/ha/com/master/MasterServer.java\n"
