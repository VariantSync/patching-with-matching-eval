        message: "pageserver: mark tenant broken when cancelling attach (#6430)\n\n## Problem\r\n\r\nWhen a tenant is in Attaching state, and waiting for the\r\n`concurrent_tenant_warmup` semaphore, it also listens for the tenant\r\ncancellation token. When that token fires, Tenant::attach drops out.\r\nMeanwhile, Tenant::set_stopping waits forever for the tenant to exit\r\nAttaching state.\r\n\r\nFixes: https://github.com/neondatabase/neon/issues/6423\r\n\r\n## Summary of changes\r\n\r\n- In the absence of a valid state for the tenant, it is set to Broken in\r\nthis path. A more elegant solution will require more refactoring, beyond\r\nthis minimal fix."
        author: John Spray <john@neon.tech>
        committer: GitHub <noreply@github.com>
        time: 'Time { raw: git_time { time: 1705938632, offset: 0, sign: 43 } }'
      target:
        id: 90e689addae554d7f79899379d3b84ff414404da
        parent_ids:
        - f0b2d4b0535fae693af1a7a18b2bb03e7ce243fb
        message: |
          pageserver: mark tenant broken when cancelling attach (#6430)

          ## Problem

          When a tenant is in Attaching state, and waiting for the
          `concurrent_tenant_warmup` semaphore, it also listens for the tenant
          cancellation token. When that token fires, Tenant::attach drops out.
          Meanwhile, Tenant::set_stopping waits forever for the tenant to exit
          Attaching state.

          Fixes: https://github.com/neondatabase/neon/issues/6423

          ## Summary of changes

          - In the absence of a valid state for the tenant, it is set to Broken in
          this path. A more elegant solution will require more refactoring, beyond
          this minimal fix.

          (cherry picked from commit 93572a3e99f572f51529b3fbb3b11dafa88f7f5c)
