        message: "fix: sort toggleNames before updating last seen (#4747)\n\nSeems like when 2 pods are trying to POST lastSeen metrics, the db gets\r\ninto a deadlock state.\r\n\r\nThis is an attempt to fix the deadlock by sorting the toggleNames before\r\nthe update.\r\n\r\nThe hypothesis is that sorted toggle names will reduce the chance of\r\nworking on the same row at the same exact time\r\n\r\nCloses #\r\n[1-1382](https://linear.app/unleash/issue/1-1382/order-data-before-updating-the-lastseen-to-reduce-change-of-deadlock)\r\n\r\nSigned-off-by: andreas-unleash <andreas@getunleash.ai>"
        author: andreas-unleash <andreas@getunleash.ai>
        committer: GitHub <noreply@github.com>
        time: 'Time { raw: git_time { time: 1694772158, offset: 180, sign: 43 } }'
      target:
        id: 790a7baf11b687d4e9e452307124dd1c38c21f07
        parent_ids:
        - e0409469efed9521143bd086ffecb1bf1af3be71
        message: |
          fix: sort toggleNames before updating last seen (#4747)

          Seems like when 2 pods are trying to POST lastSeen metrics, the db gets
          into a deadlock state.

          This is an attempt to fix the deadlock by sorting the toggleNames before
          the update.

          The hypothesis is that sorted toggle names will reduce the chance of
          working on the same row at the same exact time

          Closes #
          [1-1382](https://linear.app/unleash/issue/1-1382/order-data-before-updating-the-lastseen-to-reduce-change-of-deadlock)

          Signed-off-by: andreas-unleash <andreas@getunleash.ai>
